<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Primitives gallery</title>
<link rel="stylesheet" href="tokens.css">
<style>
  /* Only tokens below. No raw hex. */
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans); background: var(--color-surface); color: var(--color-text); }
  .cols { display: flex; gap: 24px; padding: 24px; align-items: flex-start; flex-wrap: wrap; }
  .phone { width: 390px; background: var(--color-bg); color: var(--color-text); border-radius: var(--radius-lg);
           box-shadow: var(--shadow-pop); padding: var(--space-4) var(--layout-gutter); display: flex; flex-direction: column; gap: var(--space-6); }
  h1 { font-size: var(--text-xl); line-height: var(--leading-xl); font-weight: var(--weight-xl); margin: 0; }
  h2 { font-size: var(--text-xs); line-height: var(--leading-xs); font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
       color: var(--color-text-muted); margin: 0 0 var(--space-2); }
  .row { display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: var(--space-2); }
  .tab { font-variant-numeric: tabular-nums; }
  .muted { color: var(--color-text-muted); }
  .sm { font-size: var(--text-sm); line-height: var(--leading-sm); }
  .xs { font-size: var(--text-xs); line-height: var(--leading-xs); }

  /* Button */
  .btn { font: inherit; font-size: var(--text-base); font-weight: 600; min-height: var(--layout-touch-min); padding: 0 var(--space-5);
         border-radius: var(--radius-md); border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); cursor: pointer;
         transition: transform var(--motion-fast) var(--motion-ease); }
  .btn:active { transform: scale(.97); }
  .btn:focus-visible, .focus { outline: 2px solid var(--color-focus); outline-offset: 2px; }
  .btn-primary { background: var(--color-accent); color: var(--color-on-accent); }
  .btn-secondary { background: var(--color-surface-raised); color: var(--color-text); border-color: var(--color-border); }
  .btn-ghost { background: none; color: var(--color-accent); }
  .btn-danger { background: var(--color-danger); color: var(--color-on-danger); }
  .btn[disabled] { opacity: .4; cursor: default; }
  .btn-sm { font-size: var(--text-sm); min-height: 36px; padding: 0 var(--space-4); }
  .btn-block { width: 100%; min-height: 52px; }
  .spin { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; display: inline-block; }

  /* ChoiceCard */
  .choice { display: flex; gap: var(--space-3); align-items: center; padding: var(--space-4); border-radius: var(--radius-md);
            background: var(--color-surface-raised); border: 1px solid var(--color-border); }
  .choice.sel { border: 2px solid var(--color-accent); background: var(--color-accent-soft); padding: calc(var(--space-4) - 1px); }
  .choice .t { font-weight: 600; } .choice .d { font-size: var(--text-sm); color: var(--color-text-muted); }
  .choice .check { margin-left: auto; color: var(--color-accent); }

  /* Segmented */
  .seg { display: flex; background: var(--color-surface); border-radius: var(--radius-md); padding: 4px; gap: 4px; }
  .seg button { flex: 1; font: inherit; border: 0; background: none; border-radius: var(--radius-sm); padding: var(--space-2) 0; color: var(--color-text-muted); min-height: var(--layout-touch-min); }
  .seg button[aria-checked="true"] { background: var(--color-surface-raised); color: var(--color-text); box-shadow: var(--shadow-card); font-weight: 600; }
  .seg small { display: block; font-size: var(--text-xs); color: var(--color-text-muted); font-weight: 500; }

  /* TextField */
  .field label { display: block; font-size: var(--text-sm); font-weight: 600; margin-bottom: var(--space-1); }
  .field input { width: 100%; font: inherit; min-height: var(--layout-touch-min); padding: 0 var(--space-4); border-radius: var(--radius-md);
                 border: 1px solid var(--color-border-input); background: var(--color-bg); color: var(--color-text); }
  .field input:focus, .field.f input { outline: 2px solid var(--color-focus); outline-offset: 1px; border-color: var(--color-accent); }
  .field.err input { border-color: var(--color-danger); }
  .field .help { font-size: var(--text-xs); margin-top: var(--space-1); color: var(--color-text-muted); }
  .field.err .help { color: var(--color-danger); }

  /* Chips */
  .chip { display: inline-flex; align-items: center; height: 24px; padding: 0 var(--space-2); border-radius: var(--radius-pill);
          font-size: var(--text-xs); font-weight: 600; font-variant-numeric: tabular-nums; }
  .e0 { --e: var(--color-effort-0); --es: var(--color-effort-0-soft); --ei: var(--color-effort-0-ink); }
  .e1 { --e: var(--color-effort-1); --es: var(--color-effort-1-soft); --ei: var(--color-effort-1-ink); }
  .e2 { --e: var(--color-effort-2); --es: var(--color-effort-2-soft); --ei: var(--color-effort-2-ink); }
  .e3 { --e: var(--color-effort-3); --es: var(--color-effort-3-soft); --ei: var(--color-effort-3-ink); }
  .e4 { --e: var(--color-effort-4); --es: var(--color-effort-4-soft); --ei: var(--color-effort-4-ink); }
  .e5 { --e: var(--color-effort-5); --es: var(--color-effort-5-soft); --ei: var(--color-effort-5-ink); }
  .chip { background: var(--es); color: var(--ei); }

  /* WeekStrip */
  .week { display: flex; justify-content: space-between; }
  .day { width: 44px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: var(--space-1) 0; border-radius: var(--radius-pill); }
  .day .n { font-weight: 600; font-variant-numeric: tabular-nums; }
  .day .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--e); }
  .day.missed .dot { background: none; border: 1.5px solid var(--e); }
  .day.sel { background: var(--color-accent); color: var(--color-on-accent); }
  .day.sel .muted { color: var(--color-on-accent); }
  .day.sel .dot { background: var(--color-on-accent); }

  /* SessionCard */
  .card { background: var(--color-surface-raised); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: var(--space-4);
          border-left: 4px solid var(--e); display: flex; flex-direction: column; gap: var(--space-2); }
  .card .title { font-size: var(--text-lg); line-height: var(--leading-lg); font-weight: 600; }
  .card.missed .title { color: var(--color-text-muted); }
  .card .meta { font-size: var(--text-sm); color: var(--color-text-muted); font-variant-numeric: tabular-nums; }
  .status { margin-left: auto; font-size: var(--text-xs); font-weight: 600; }
  .done { color: var(--color-success); }

  /* Steps */
  .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .steps li { display: flex; gap: var(--space-3); align-items: center; padding: var(--space-3) var(--space-2); border-bottom: 1px solid var(--color-border); }
  .steps li.cur { background: var(--color-accent-soft); border-left: 3px solid var(--color-accent); }
  .steps .k { width: 96px; font-size: var(--text-sm); color: var(--color-text-muted); }
  .steps .v { font-variant-numeric: tabular-nums; flex: 1; }
  .rep { margin-left: var(--space-6); }
  .xn { background: var(--color-surface); border-radius: var(--radius-pill); padding: 0 var(--space-2); font-size: var(--text-xs); font-weight: 600; }

  /* Pace table */
  table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
  td { padding: var(--space-2) 0; border-bottom: 1px solid var(--color-border); }
  td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

  /* RPE */
  .rpe { display: flex; justify-content: space-between; }
  .rpe div { display: flex; flex-direction: column; align-items: center; gap: var(--space-1); width: 64px; text-align: center; }
  .rpe .c { width: 56px; height: 56px; border-radius: 50%; background: var(--es); color: var(--ei); display: grid; place-items: center; font-weight: 700; font-size: var(--text-lg); }
  .rpe .on .c { box-shadow: 0 0 0 2px var(--color-bg), 0 0 0 4px var(--e); }
  .rpe .on span { font-weight: 600; }

  /* Banner */
  .banner { display: flex; gap: var(--space-3); align-items: flex-start; padding: var(--space-3); border-radius: var(--radius-md); font-size: var(--text-sm); }
  .b-info { background: var(--color-accent-soft); color: var(--color-accent-ink); }
  .b-warn { background: var(--color-warning-soft); color: var(--color-warning); }
  .b-err { background: var(--color-danger-soft); color: var(--color-danger); }
  .b-ok { background: var(--color-success-soft); color: var(--color-success); }

  /* ListRow + Switch */
  .list { border-radius: var(--radius-md); background: var(--color-surface-raised); border: 1px solid var(--color-border); }
  .li { display: flex; align-items: center; gap: var(--space-3); min-height: 52px; padding: 0 var(--space-4); border-bottom: 1px solid var(--color-border); }
  .li:last-child { border-bottom: 0; }
  .li .s { font-size: var(--text-sm); color: var(--color-text-muted); }
  .sw { margin-left: auto; width: 44px; height: 26px; border-radius: var(--radius-pill); background: var(--color-border-input); position: relative; flex: none; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--color-surface-raised); }
  .sw.on { background: var(--color-accent); } .sw.on::after { left: 21px; }

  /* Paywall */
  .price { font-size: var(--text-xl); line-height: var(--leading-xl); font-weight: 700; font-variant-numeric: tabular-nums; }
  .pill { background: var(--color-accent); color: var(--color-on-accent); border-radius: var(--radius-pill); padding: 2px var(--space-2); font-size: var(--text-xs); font-weight: 600; }

  /* Tracker (always dark) */
  .tracker { border-radius: var(--radius-lg); padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-4);
             background: var(--color-bg); color: var(--color-text); }
  .metric { font-size: var(--text-metric); line-height: var(--leading-metric); font-weight: var(--weight-metric); font-variant-numeric: tabular-nums; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
  .grid2 .v { font-size: var(--text-xl); font-weight: 700; font-variant-numeric: tabular-nums; }
  .off { color: var(--color-warning); font-weight: 600; font-size: var(--text-sm); }

  /* Tabbar */
  .tabbar { display: flex; justify-content: space-around; border-top: 1px solid var(--color-border); background: var(--color-surface-raised);
            height: var(--layout-tabbar); align-items: center; margin: 0 calc(-1 * var(--layout-gutter)) calc(-1 * var(--space-4)); border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
  .tabbar div { display: flex; flex-direction: column; align-items: center; font-size: var(--text-xs); font-weight: 500; color: var(--color-text-muted); gap: 2px; }
  .tabbar .a { color: var(--color-accent); }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="cols" id="cols"></div>

<template id="phone">
<div class="phone">
  <h1>Primitives <span class="muted sm" data-label></span></h1>

  <section><h2>Button</h2>
    <div class="row">
      <button class="btn btn-primary">Créer mon plan</button>
      <button class="btn btn-secondary">Plus tard</button>
      <button class="btn btn-ghost">Voir</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="btn btn-primary focus">Focus</button>
      <button class="btn btn-primary" disabled>Désactivé</button>
      <button class="btn btn-primary" aria-busy="true"><span class="spin"></span><span class="sr">Envoi</span></button>
      <button class="btn btn-danger btn-sm">Supprimer</button>
    </div>
  </section>

  <section><h2>ChoiceCard</h2>
    <div class="stack" role="radiogroup">
      <div class="choice sel" role="radio" aria-checked="true"><div><div class="t">Semi-marathon</div><div class="d">21,1 km · objectif chrono</div></div>
        <svg class="i check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>
      <div class="choice" role="radio" aria-checked="false"><div><div class="t">Reprendre la course</div><div class="d">Après une pause ou une blessure</div></div></div>
    </div>
  </section>

  <section><h2>SegmentedControl · séances / semaine</h2>
    <div class="seg" role="radiogroup">
      <button role="radio" aria-checked="false">3<small>≈ 30 km</small></button>
      <button role="radio" aria-checked="true">4<small>≈ 38 km</small></button>
      <button role="radio" aria-checked="false">5<small>≈ 46 km</small></button>
    </div>
  </section>

  <section><h2>TextField</h2>
    <div class="stack">
      <div class="field f"><label>Temps de référence</label><input value="47:30" class="tab"><div class="help">Ton meilleur 10 km de l'année</div></div>
      <div class="field err"><label>E-mail</label><input value="lucas@"><div class="help">Adresse e-mail incomplète</div></div>
    </div>
  </section>

  <section><h2>EffortChip · types de séance</h2>
    <div class="row">
      <span class="chip e0">Repos</span><span class="chip e1">Footing</span><span class="chip e1">Sortie longue</span>
      <span class="chip e2">Allure semi</span><span class="chip e3">Seuil</span><span class="chip e4">VMA</span><span class="chip e5">Test</span>
    </div>
  </section>

  <section><h2>WeekStrip</h2>
    <div class="week">
      <div class="day e1"><span class="xs muted">lun</span><span class="n">19</span><span class="dot"></span></div>
      <div class="day e0"><span class="xs muted">mar</span><span class="n">20</span></div>
      <div class="day e4 sel"><span class="xs muted">mer</span><span class="n">21</span><span class="dot"></span></div>
      <div class="day e0"><span class="xs muted">jeu</span><span class="n">22</span></div>
      <div class="day e3 missed"><span class="xs muted">ven</span><span class="n">23</span><span class="dot"></span></div>
      <div class="day e0"><span class="xs muted">sam</span><span class="n">24</span></div>
      <div class="day e1"><span class="xs muted">dim</span><span class="n">25</span><span class="dot"></span></div>
    </div>
  </section>

  <section><h2>Banner</h2>
    <div class="stack">
      <div class="banner b-info"><svg class="i" viewBox="0 0 24 24"><path d="M12 16v-4M12 8h.01"/><circle cx="12" cy="12" r="10"/></svg>
        <div><strong>Plan ajusté.</strong> Tes allures VMA ralentissent de 3 s/km après ta dernière séance.</div></div>
      <div class="banner b-warn">Séance modifiée depuis l'export. Renvoie-la sur ta montre.</div>
      <div class="banner b-ok">Séance envoyée sur ta montre.</div>
      <div class="banner b-err">Connexion à Strava impossible. Réessaie.</div>
    </div>
  </section>

  <section><h2>SessionCard</h2>
    <div class="stack">
      <div class="card e4"><div class="row"><span class="chip e4">VMA</span><span class="status muted">Aujourd'hui</span></div>
        <div class="title">6 × 3 min allure VMA</div><div class="meta">52 min · 9,4 km · récup 2 min</div>
        <div class="row"><button class="btn btn-primary btn-sm">Démarrer</button><button class="btn btn-secondary btn-sm">Envoyer sur la montre</button></div></div>
      <div class="card e1"><div class="row"><span class="chip e1">Sortie longue</span><span class="status done">✓ Faite</span></div>
        <div class="title">1 h 20 en endurance</div><div class="meta">14,2 km · 5:38 /km</div></div>
      <div class="card e3 missed"><div class="row"><span class="chip e3">Seuil</span><span class="status muted">Manquée</span></div>
        <div class="title">3 × 10 min au seuil</div><div class="meta">55 min · 10,1 km</div></div>
    </div>
  </section>

  <section><h2>WorkoutStepList</h2>
    <ul class="steps">
      <li><span class="k">Échauffement</span><span class="v">15 min</span><span class="chip e1">5:50–6:15</span></li>
      <li><span class="k">Bloc</span><span class="v">6 répétitions</span><span class="xn">× 6</span></li>
      <li class="rep cur"><span class="k">Effort</span><span class="v">3 min</span><span class="chip e4">3:58 /km</span></li>
      <li class="rep"><span class="k">Récup</span><span class="v">2 min</span><span class="chip e0">trot</span></li>
      <li><span class="k">Retour au calme</span><span class="v">10 min</span><span class="chip e1">6:00+</span></li>
    </ul>
  </section>

  <section><h2>PaceZoneTable</h2>
    <table>
      <tr><td><span class="chip e1">Endurance</span></td><td>5:40–6:10 /km</td></tr>
      <tr><td><span class="chip e2">Allure semi</span></td><td>4:42 /km</td></tr>
      <tr><td><span class="chip e3">Seuil</span></td><td>4:28 /km</td></tr>
      <tr><td><span class="chip e4">VMA</span></td><td>3:58 /km</td></tr>
    </table>
  </section>

  <section><h2>RPEScale</h2>
    <div class="rpe" role="radiogroup" aria-label="Comment t'es-tu senti ?">
      <div class="e1"><span class="c">1</span><span class="xs">Très facile</span></div>
      <div class="e2"><span class="c">2</span><span class="xs">Facile</span></div>
      <div class="e3"><span class="c">3</span><span class="xs">Moyen</span></div>
      <div class="e4 on"><span class="c">4</span><span class="xs">Dur</span></div>
      <div class="e5"><span class="c">5</span><span class="xs">Extrême</span></div>
    </div>
  </section>

  <section><h2>PaywallCard</h2>
    <div class="stack" role="radiogroup">
      <div class="choice sel" role="radio" aria-checked="true"><div><div class="row"><span class="t">Annuel</span><span class="pill">Recommandé</span></div>
        <div class="price">119 €<span class="sm muted"> / an</span></div><div class="d">soit 9,92 € / mois · 14 jours offerts</div></div></div>
      <div class="choice" role="radio" aria-checked="false"><div><div class="t">Mensuel</div><div class="price">15 €<span class="sm muted"> / mois</span></div></div></div>
    </div>
  </section>

  <section><h2>ListRow + Switch</h2>
    <div class="list">
      <div class="li"><div><div>Strava</div><div class="s">Connecté · synchro il y a 2 h</div></div><svg class="i" style="margin-left:auto" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></div>
      <div class="li"><div>Conseils nutrition</div><span class="sw on" role="switch" aria-checked="true"></span></div>
      <div class="li"><div>Rappel de séance</div><span class="sw" role="switch" aria-checked="false"></span></div>
    </div>
  </section>

  <section><h2>LiveMetricTile · tracker (toujours sombre)</h2>
    <div class="tracker" data-theme="dark">
      <div class="row"><span class="chip e4">VMA</span><span class="sm muted">Répétition 4/6</span><span class="off" style="margin-left:auto">▲ trop rapide</span></div>
      <div><div class="metric">3:51</div><div class="xs muted">allure /km · cible 3:58</div></div>
      <div class="grid2">
        <div><div class="v">1:42</div><div class="xs muted">restant</div></div>
        <div><div class="v">5,62</div><div class="xs muted">km</div></div>
        <div><div class="v">28:14</div><div class="xs muted">durée</div></div>
        <div><div class="v">142</div><div class="xs muted">bpm</div></div>
      </div>
    </div>
  </section>

  <div class="tabbar" role="tablist">
    <div class="a" role="tab" aria-selected="true"><svg class="i" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>Accueil</div>
    <div role="tab"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Plan</div>
    <div role="tab"><svg class="i" viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>Courses</div>
    <div role="tab"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profil</div>
  </div>
</div>
</template>

<script>
  const cols = document.getElementById('cols');
  for (const theme of ['light', 'dark']) {
    const wrap = document.createElement('div');
    wrap.setAttribute('data-theme', theme);
    wrap.style.background = 'transparent';
    wrap.append(document.getElementById('phone').content.cloneNode(true));
    wrap.querySelector('[data-label]').textContent = theme === 'light' ? 'clair' : 'sombre';
    cols.append(wrap);
  }
  document.querySelectorAll('.sr').forEach(e => Object.assign(e.style, {position:'absolute', width:'1px', height:'1px', overflow:'hidden', clip:'rect(0 0 0 0)'}));
</script>
</body>
</html>
